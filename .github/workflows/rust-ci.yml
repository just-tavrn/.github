# SPDX-License-Identifier: Apache-2.0
#
# Reusable Rust CI: rustfmt, clippy (warnings are errors), tests and cargo-deny. Used by tavrn-crypto and
# tavrn-node.
#
# Caller:
#   jobs:
#     rust:
#       if: ${{ vars.CI_ENABLED == 'true' }}
#       uses: just-tavrn/.github/.github/workflows/rust-ci.yml@main
#       with:
#         extra-targets: wasm32-unknown-unknown
#         extra-clippy: |
#           -p tavrn-crypto --target wasm32-unknown-unknown
#         postgres: true
#         runner: tavrn-heavy
#       secrets:
#         READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
#
# While the repositories are private, READ_TOKEN (a fine-grained PAT with contents read on the just-tavrn
# repositories, docs/GITHUB.md) lets the job fetch the protocol submodule and git dependencies such as
# tavrn-crypto. Without it only public repositories can be fetched.
#
# On the self-hosted runners (runner: tavrn-heavy) the runner image provides the toolchain (rust-toolchain.toml
# as of the image build; the toolchain and extra-targets inputs are checked, not installed), the Cargo caches
# live in the stack's RAM cache, and the stack's PostgreSQL (TAVRN_TEST_DATABASE_URL) and the runner's private
# Valkey (TAVRN_TEST_CACHE_URL) are always set.
name: Rust CI (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Where the job runs: a GitHub-hosted label (default ubuntu-latest) or a self-hosted runner class of the
          tavrn runner stack (tavrn-heavy, runner/README.md). Self-hosted only for trusted events: pushes, manual
          and scheduled runs, and pull requests from branches of the calling repository; pull requests from forks
          and from Dependabot always run on ubuntu-latest.
        type: string
        default: ubuntu-latest
      working-directory:
        description: Directory of the Cargo workspace.
        type: string
        default: "."
      toolchain:
        description: Rust toolchain for dtolnay/rust-toolchain (rust-toolchain.toml still applies inside the repository).
        type: string
        default: stable
      extra-targets:
        description: Additional rustup targets, comma-separated (for example wasm32-unknown-unknown).
        type: string
        default: ""
      extra-clippy:
        description: Additional clippy runs, one argument line per line (each runs as `cargo clippy <line> -- -D warnings`).
        type: string
        default: ""
      clippy-args:
        description: Arguments of the main clippy run.
        type: string
        default: "--workspace --all-targets"
      test-args:
        description: Arguments of `cargo test`.
        type: string
        default: "--workspace"
      postgres:
        description: Start a PostgreSQL 17 service and export TAVRN_TEST_DATABASE_URL for the tests (GitHub-hosted; the self-hosted stack always has one).
        type: boolean
        default: false
      pre-test:
        description: Shell commands run before the tests (for example installing livekit-server or ffmpeg).
        type: string
        default: ""
      test-env:
        description: Extra environment for the tests, KEY=value lines (appended to GITHUB_ENV).
        type: string
        default: ""
      cargo-deny:
        description: Run cargo-deny (advisories, bans, licenses, sources) with the repository's deny.toml.
        type: boolean
        default: true
      cargo-deny-version:
        description: cargo-deny release to use.
        type: string
        default: "0.20.2"
      submodules:
        description: Checkout submodules (false, true or recursive).
        type: string
        default: recursive
      skip:
        description: "Report the job as skipped without running anything (the caller decided the change needs no build, for example docs only); a skipped job counts as a passed check"
        type: boolean
        required: false
        default: false
    secrets:
      READ_TOKEN:
        description: Optional token with read access to the private just-tavrn repositories (submodules, git dependencies).
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    # Self-hosted runners execute the job's code in the runner VM: forks, Dependabot and dependabot/* branches (even
    # when a person dispatches the run) never get them (the expression falls back to ubuntu-latest for those;
    # runner/README.md, "Security").
    if: ${{ vars.CI_ENABLED == 'true' && !inputs.skip }}
    runs-on: ${{ fromJSON(startsWith(inputs.runner, 'tavrn-') && github.event_name != 'pull_request_target' && github.actor != 'dependabot[bot]' && !startsWith(github.ref, 'refs/heads/dependabot/') && !startsWith(github.head_ref, 'dependabot/') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && format('["self-hosted","linux","x64","{0}"]', inputs.runner) || (startsWith(inputs.runner, 'tavrn-') && '"ubuntu-latest"' || toJSON(inputs.runner))) }}
    services:
      postgres:
        # An empty image skips the service: GitHub-hosted runs only.
        image: ${{ inputs.postgres && !(startsWith(inputs.runner, 'tavrn-') && github.event_name != 'pull_request_target' && github.actor != 'dependabot[bot]' && !startsWith(github.ref, 'refs/heads/dependabot/') && !startsWith(github.head_ref, 'dependabot/') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && 'postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24' || '' }}
        env:
          POSTGRES_USER: tavrn
          POSTGRES_PASSWORD: tavrn
          POSTGRES_DB: tavrn_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tavrn" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
        working-directory: .
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
            echo "fetching just-tavrn repositories with READ_TOKEN"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repository itself is fetched with the job's own token (READ_TOKEN need not cover it); the
          # private submodules follow in the next step through the READ_TOKEN URL rewrite above.
          submodules: false
          token: ${{ github.token }}
          persist-credentials: false
      - name: Submodules
        if: ${{ inputs.submodules != '' && inputs.submodules != 'false' }}
        working-directory: .
        run: git submodule update --init ${{ inputs.submodules == 'recursive' && '--recursive' || '' }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy
          targets: ${{ inputs.extra-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          workspaces: ${{ inputs.working-directory }}
      - name: Toolchain of the runner image
        if: ${{ runner.environment == 'self-hosted' }}
        env:
          EXTRA_TARGETS: ${{ inputs.extra-targets }}
        run: |
          cargo --version && cargo clippy --version && rustfmt --version
          installed="$(rustup target list --installed)"
          for t in ${EXTRA_TARGETS//,/ }; do
            grep -qx "$t" <<< "$installed" || { echo "::error::target $t is not in the runner image (runner/Dockerfile)"; exit 1; }
          done
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        env:
          CLIPPY_ARGS: ${{ inputs.clippy-args }}
        run: |
          # shellcheck disable=SC2086 # word splitting of the argument list is intended
          cargo clippy $CLIPPY_ARGS -- -D warnings
      - name: clippy (extra)
        if: ${{ inputs.extra-clippy != '' }}
        env:
          EXTRA_CLIPPY: ${{ inputs.extra-clippy }}
        run: |
          # shellcheck disable=SC2086 # word splitting of the argument list is intended
          while IFS= read -r line; do
            [ -z "${line// /}" ] && continue
            echo "::group::cargo clippy $line"
            cargo clippy $line -- -D warnings
            echo "::endgroup::"
          done <<< "$EXTRA_CLIPPY"
      - name: Test environment
        env:
          POSTGRES: ${{ inputs.postgres }}
          TEST_ENV: ${{ inputs.test-env }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          if [ "$POSTGRES" = "true" ] && [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            echo "TAVRN_TEST_DATABASE_URL=postgres://tavrn:tavrn@localhost:5432/tavrn_test" >> "$GITHUB_ENV"
          fi
          if [ -n "$TEST_ENV" ]; then
            printf '%s\n' "$TEST_ENV" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' >> "$GITHUB_ENV" || true
          fi
      - name: Prepare tests
        if: ${{ inputs.pre-test != '' }}
        env:
          PRE_TEST: ${{ inputs.pre-test }}
          # Lets the script skip what the self-hosted runner image already provides (runner/README.md).
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash -euo pipefail -c "$PRE_TEST"
      - name: test
        env:
          TEST_ARGS: ${{ inputs.test-args }}
        run: |
          # shellcheck disable=SC2086 # word splitting of the argument list is intended
          cargo test $TEST_ARGS
      # The release binary instead of the container action: it sees the git credentials of the runner,
      # which the private git dependencies need.
      - name: cargo-deny
        if: ${{ inputs.cargo-deny }}
        env:
          DENY_VERSION: ${{ inputs.cargo-deny-version }}
        run: |
          tmp="$(mktemp -d)"
          name="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}"
          curl -fsSL -o "$tmp/$name.tar.gz" "$base/$name.tar.gz"
          curl -fsSL -o "$tmp/$name.tar.gz.sha256" "$base/$name.tar.gz.sha256"
          echo "$(cut -d' ' -f1 < "$tmp/$name.tar.gz.sha256")  $tmp/$name.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/$name.tar.gz" -C "$tmp"
          "$tmp/$name/cargo-deny" --version
          "$tmp/$name/cargo-deny" --log-level error check
