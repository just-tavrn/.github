# SPDX-License-Identifier: Apache-2.0
#
# Reusable JavaScript CI: pnpm install from the lockfile, license and SPDX checks, typecheck, tests and an
# optional build. Used by tavrn-protocol, tavrn-crypto (npm package), tavrn-js and tavrn-web.
#
# Caller:
#   jobs:
#     js:
#       if: ${{ vars.CI_ENABLED == 'true' }}
#       uses: just-tavrn/.github/.github/workflows/js-ci.yml@main
#       with:
#         license-check: scripts/check-js-licenses.mjs
#         build: pnpm --filter @tavrn/web build
#         artifact-name: web-dist
#         artifact-path: web/dist
#         runner: tavrn-heavy
#       secrets:
#         READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
#
# pnpm comes from the "packageManager" field of the caller's package.json. While the repositories are
# private, READ_TOKEN lets pnpm fetch git dependencies such as github:just-tavrn/tavrn-js#v0.1.0&path:sdk.
# On the self-hosted runners (runner: tavrn-heavy) Node.js and Rust come from the runner image (node-version is
# checked, not installed) and the pnpm store and Cargo caches live in the stack's RAM cache.
name: JavaScript CI (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Where the job runs: a GitHub-hosted label (default ubuntu-latest) or a self-hosted runner class of the
          tavrn runner stack (tavrn-heavy, runner/README.md). Self-hosted only for trusted events: pushes, manual
          and scheduled runs, and pull requests from branches of the calling repository; pull requests from forks
          and from Dependabot always run on ubuntu-latest.
        type: string
        default: ubuntu-latest
      working-directory:
        description: Directory of the pnpm workspace.
        type: string
        default: "."
      node-version:
        description: Node.js version.
        type: string
        default: "24"
      license-check:
        description: Path of the JavaScript license check script (run with node), relative to the working directory; empty to skip.
        type: string
        default: scripts/check-js-licenses.mjs
      spdx-check:
        description: Path of the SPDX header check script, relative to the working directory; empty to skip.
        type: string
        default: scripts/check-spdx.sh
      typecheck:
        description: Typecheck command; empty to skip.
        type: string
        default: pnpm -r --if-present typecheck
      test:
        description: Test command; empty to skip.
        type: string
        default: pnpm -r --if-present test
      build:
        description: Build command run after the tests; empty to skip.
        type: string
        default: ""
      artifact-name:
        description: >-
          Upload artifact-path after the build as a workflow artifact of this name (one day), so later jobs of the
          caller's run use the build instead of repeating it; empty to skip.
        type: string
        default: ""
      artifact-path:
        description: Path of the build output to upload, relative to the working directory.
        type: string
        default: ""
      pre-test:
        description: Shell commands run after the install and before the checks (for example generating code).
        type: string
        default: ""
      rust-wasm:
        description: Install Rust with the wasm32-unknown-unknown target (and cache ~/.cargo, where the build script installs wasm-bindgen-cli) for packages that build WebAssembly in pre-test.
        type: boolean
        default: false
      submodules:
        description: Checkout submodules (false, true or recursive).
        type: string
        default: recursive
      skip:
        description: "Report the job as skipped without running anything (the caller decided the change needs no build, for example docs only); a skipped job counts as a passed check"
        type: boolean
        required: false
        default: false
      timeout-minutes:
        description: Time limit of the job (GitHub's default is six hours, on a pool of two heavy runners).
        type: number
        default: 30
    secrets:
      READ_TOKEN:
        description: Optional token with read access to the private just-tavrn repositories (submodules, git dependencies).
        required: false

permissions:
  contents: read

jobs:
  # Self-hosted runners execute the job's code in the runner VM: forks, Dependabot and dependabot/* branches (even when
  # a person dispatches the run) never get them; route.yml holds that rule and falls back to ubuntu-latest for those
  # (runner/README.md, "Security").
  route:
    if: ${{ vars.CI_ENABLED == 'true' && !inputs.skip }}
    uses: ./.github/workflows/route.yml
    with:
      runner: ${{ inputs.runner }}

  js:
    name: JavaScript (install, typecheck, test)
    needs: route
    if: ${{ vars.CI_ENABLED == 'true' && !inputs.skip }}
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
        working-directory: .
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "ssh://git@github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "git@github.com:just-tavrn/"
            echo "fetching just-tavrn repositories with READ_TOKEN"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repository itself is fetched with the job's own token (READ_TOKEN need not cover it); the
          # private submodules follow in the next step through the READ_TOKEN URL rewrite above.
          submodules: false
          token: ${{ github.token }}
          persist-credentials: false
      - name: Submodules
        if: ${{ inputs.submodules != '' && inputs.submodules != 'false' }}
        working-directory: .
        run: git submodule update --init ${{ inputs.submodules == 'recursive' && '--recursive' || '' }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: ${{ inputs.rust-wasm && runner.environment == 'github-hosted' }}
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ inputs.rust-wasm && runner.environment == 'github-hosted' }}
        with:
          workspaces: ${{ inputs.working-directory }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - name: Node.js of the runner image
        if: ${{ runner.environment == 'self-hosted' }}
        env:
          NODE_WANTED: ${{ inputs.node-version }}
        run: |
          have="$(node --version)"
          case "$have" in
            "v${NODE_WANTED}"|"v${NODE_WANTED}".*) echo "Node.js $have" ;;
            *) echo "::error::the runner image has Node.js $have, the caller wants $NODE_WANTED (runner/Dockerfile)"; exit 1 ;;
          esac
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prepare
        if: ${{ inputs.pre-test != '' }}
        env:
          PRE_TEST: ${{ inputs.pre-test }}
          # Lets the script skip what the self-hosted runner image already provides (runner/README.md).
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash -euo pipefail -c "$PRE_TEST"
      - name: SPDX headers
        if: ${{ inputs.spdx-check != '' }}
        env:
          SCRIPT: ${{ inputs.spdx-check }}
        run: bash "$SCRIPT"
      - name: Dependency licenses
        if: ${{ inputs.license-check != '' }}
        env:
          SCRIPT: ${{ inputs.license-check }}
        run: node "$SCRIPT"
      - name: Typecheck
        if: ${{ inputs.typecheck != '' }}
        env:
          CMD: ${{ inputs.typecheck }}
        run: bash -euo pipefail -c "$CMD"
      - name: Test
        if: ${{ inputs.test != '' }}
        env:
          CMD: ${{ inputs.test }}
        run: bash -euo pipefail -c "$CMD"
      - name: Build
        if: ${{ inputs.build != '' }}
        env:
          CMD: ${{ inputs.build }}
        run: bash -euo pipefail -c "$CMD"
      - name: Upload the build
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          retention-days: 1
          if-no-files-found: error
