# SPDX-License-Identifier: Apache-2.0
#
# Reusable secret scan with gitleaks (the CLI, no licence key needed). Scans the full git history of the
# caller's repository; pull requests are scanned as well.
#
# Caller:
#   jobs:
#     gitleaks:
#       if: ${{ vars.CI_ENABLED == 'true' }}
#       uses: just-tavrn/.github/.github/workflows/gitleaks.yml@main
name: Gitleaks (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: gitleaks release to use (without the leading v).
        type: string
        default: "8.30.1"
      config:
        description: Path of a gitleaks configuration in the caller's repository (empty for the default rules, or .gitleaks.toml when present).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.version }}
        run: |
          tmp="$(mktemp -d)"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tmp/$file" "$base/$file"
          curl -fsSL -o "$tmp/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$tmp" && grep " $file\$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$file" -C "$tmp" gitleaks
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the history
        env:
          GITLEAKS_CONFIG_INPUT: ${{ inputs.config }}
        run: |
          args=(git --redact --verbose --no-banner)
          if [ -n "$GITLEAKS_CONFIG_INPUT" ]; then
            args+=(--config "$GITLEAKS_CONFIG_INPUT")
          elif [ -f .gitleaks.toml ]; then
            args+=(--config .gitleaks.toml)
          fi
          gitleaks "${args[@]}" .
