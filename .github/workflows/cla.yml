# SPDX-License-Identifier: Apache-2.0
#
# Reusable CLA check (CONTRIBUTING.md, CLA.md). Asks the author of a pull request to sign the contributor
# license agreement once and records the signature in the private repository just-tavrn/cla-signatures.
#
# Caller (in every code repository, .github/workflows/cla.yml):
#
#   name: CLA
#   on:
#     issue_comment:
#       types: [created]
#     pull_request_target:
#       types: [opened, closed, synchronize]
#   permissions:
#     actions: write
#     contents: read
#     pull-requests: write
#     statuses: write
#   jobs:
#     cla:
#       if: ${{ vars.CI_ENABLED == 'true' }}
#       uses: just-tavrn/.github/.github/workflows/cla.yml@main
#       secrets:
#         CLA_PAT: ${{ secrets.CLA_PAT }}
#
# CLA_PAT: fine-grained personal access token with Contents read and write on just-tavrn/cla-signatures
# (docs/GITHUB.md). Pull-request comments and the status use the caller's GITHUB_TOKEN.
name: CLA (reusable)

on:
  workflow_call:
    secrets:
      CLA_PAT:
        description: Fine-grained PAT with contents write on just-tavrn/cla-signatures.
        required: true

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor license agreement
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/just-tavrn/.github/blob/main/CLA.md
          branch: main
          remote-organization-name: just-tavrn
          remote-repository-name: cla-signatures
          allowlist: dependabot[bot],renovate[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can merge it, please read the
            [contributor license agreement](https://github.com/just-tavrn/.github/blob/main/CLA.md)
            and sign it by replying to this pull request with the sentence below. You keep your copyright,
            and you sign only once for all tavrn repositories. A DCO sign-off is not needed.
          custom-allsigned-prcomment: All contributors of this pull request have signed the CLA. Thank you.
