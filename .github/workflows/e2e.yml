# SPDX-License-Identifier: Apache-2.0
#
# Reusable end-to-end run (Playwright) on the self-hosted runners of the tavrn runner stack (label tavrn-e2e,
# runner/README.md): ephemeral containers in the runner VM with Node.js, Chromium, livekit-server and ffmpeg in
# the image, Docker through the stack's DinD. The node under test comes from one of:
#   node-image     a container image (ghcr.io/just-tavrn/tavrn-node:<tag>); tavrn-node, livekit-server and
#                  ffmpeg are copied out of it onto the PATH and E2E_NODE_BIN points at the node binary,
#   node-artifact  a workflow artifact of the calling run that contains the tavrn-node binary,
#   node-binary    a path to a binary that already exists on the runner.
# The suite finds the node through E2E_NODE_BIN (and E2E_NODE_IMAGE when an image was given).
#
# Caller (tavrn-web):
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#       inputs:
#         node-image: { type: string, default: "ghcr.io/just-tavrn/tavrn-node:edge" }
#   jobs:
#     e2e:
#       if: ${{ vars.CI_ENABLED == 'true' }}
#       uses: just-tavrn/.github/.github/workflows/e2e.yml@main
#       with:
#         node-image: ${{ inputs.node-image || 'ghcr.io/just-tavrn/tavrn-node:edge' }}
#       secrets:
#         READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
#
# Security: a self-hosted runner executes the caller's code in the runner VM. The job is skipped for pull
# requests from forks and from Dependabot and for pull_request_target events (runner/README.md, "Security").
name: End-to-end (reusable)

on:
  workflow_call:
    inputs:
      node-image:
        description: Container image of the node to test (pulled from ghcr.io).
        type: string
        default: ""
      node-artifact:
        description: Name of an artifact of this workflow run that contains the tavrn-node binary.
        type: string
        default: ""
      node-binary:
        description: Path of a tavrn-node binary on the runner.
        type: string
        default: ""
      working-directory:
        description: Directory of the Playwright suite.
        type: string
        default: e2e
      playwright-args:
        description: Arguments for `playwright test`.
        type: string
        default: "--project chromium --project mobile-android --workers=2"
      browsers:
        description: Browsers to install for Playwright (the runner image has Chromium and its system dependencies; others download into the cache without system dependencies).
        type: string
        default: chromium
      voice:
        description: Run the voice tests (needs livekit-server; from the image or the runner).
        type: boolean
        default: true
      node-version:
        description: Node.js major version the suite expects (checked against the runner image).
        type: string
        default: "24"
      pre-test:
        description: Shell commands run in the repository root after the install (for example generating code).
        type: string
        default: ""
      submodules:
        description: Checkout submodules (false, true or recursive).
        type: string
        default: recursive
    secrets:
      READ_TOKEN:
        description: Optional token with read access to the private just-tavrn repositories (submodules, git dependencies).
        required: false

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: End-to-end (Playwright)
    # Never for forks, Dependabot, dependabot/* branches (even dispatched by a person) or pull_request_target: the
    # runner executes the checked-out code.
    if: ${{ vars.CI_ENABLED == 'true' && github.event_name != 'pull_request_target' && github.actor != 'dependabot[bot]' && !startsWith(github.ref, 'refs/heads/dependabot/') && !startsWith(github.head_ref, 'dependabot/') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
    runs-on: [self-hosted, linux, x64, tavrn-e2e]
    timeout-minutes: 90
    concurrency:
      group: tavrn-e2e-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check the node source
        env:
          NODE_IMAGE: ${{ inputs.node-image }}
          NODE_ARTIFACT: ${{ inputs.node-artifact }}
          NODE_BINARY: ${{ inputs.node-binary }}
        run: |
          n=0
          for v in "$NODE_IMAGE" "$NODE_ARTIFACT" "$NODE_BINARY"; do [ -n "$v" ] && n=$((n + 1)); done
          if [ "$n" -ne 1 ]; then
            echo "::error::set exactly one of node-image, node-artifact, node-binary"
            exit 1
          fi
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
        run: |
          # Per-job git configuration, removed again in the cleanup step (also on ephemeral runners).
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          : > "$GIT_CONFIG_GLOBAL"
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repository itself is fetched with the job's own token (READ_TOKEN need not cover it); the
          # private submodules follow in the next step through the READ_TOKEN URL rewrite above.
          submodules: false
          token: ${{ github.token }}
          persist-credentials: false
      - name: Submodules
        if: ${{ inputs.submodules != '' && inputs.submodules != 'false' }}
        working-directory: .
        run: git submodule update --init ${{ inputs.submodules == 'recursive' && '--recursive' || '' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Node.js of the runner image
        env:
          NODE_WANTED: ${{ inputs.node-version }}
        run: |
          have="$(node --version)"
          case "$have" in
            "v${NODE_WANTED}"|"v${NODE_WANTED}".*) echo "Node.js $have" ;;
            *) echo "::error::the runner image has Node.js $have, the caller wants $NODE_WANTED (runner/Dockerfile)"; exit 1 ;;
          esac
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prepare
        if: ${{ inputs.pre-test != '' }}
        env:
          PRE_TEST: ${{ inputs.pre-test }}
        run: bash -euo pipefail -c "$PRE_TEST"
      - name: Node from the image
        if: ${{ inputs.node-image != '' }}
        env:
          NODE_IMAGE: ${{ inputs.node-image }}
          # The job token pulls the image when the package grants the calling repository read access
          # (package settings, "Manage Actions access"; docs/GITHUB.md). Fine-grained PATs cannot read ghcr.io.
          GHCR_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/tavrn-bin"
          mkdir -p "$bin"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$NODE_IMAGE"
          cid="$(docker create "$NODE_IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for f in tavrn-node livekit-server ffmpeg; do
            docker cp "$cid:/usr/local/bin/$f" "$bin/$f" || echo "$f not in the image"
          done
          docker logout ghcr.io
          echo "$bin" >> "$GITHUB_PATH"
          echo "E2E_NODE_BIN=$bin/tavrn-node" >> "$GITHUB_ENV"
          echo "E2E_NODE_IMAGE=$NODE_IMAGE" >> "$GITHUB_ENV"
          "$bin/tavrn-node" --version
      - name: Node from an artifact
        if: ${{ inputs.node-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.node-artifact }}
          path: ${{ runner.temp }}/tavrn-artifact
      - name: Node binary path
        if: ${{ inputs.node-artifact != '' || inputs.node-binary != '' }}
        env:
          NODE_BINARY: ${{ inputs.node-binary }}
        run: |
          if [ -n "$NODE_BINARY" ]; then
            node_bin="$NODE_BINARY"
          else
            node_bin="$(find "$RUNNER_TEMP/tavrn-artifact" -type f -name tavrn-node | head -n 1)"
            chmod +x "$node_bin"
          fi
          [ -x "$node_bin" ] || { echo "::error::no executable tavrn-node found"; exit 1; }
          echo "E2E_NODE_BIN=$node_bin" >> "$GITHUB_ENV"
          "$node_bin" --version
      - name: Playwright browsers
        working-directory: ${{ inputs.working-directory }}
        env:
          BROWSERS: ${{ inputs.browsers }}
        run: |
          # shellcheck disable=SC2086 # word splitting of the argument list is intended
          pnpm exec playwright install $BROWSERS
      - name: Playwright
        working-directory: ${{ inputs.working-directory }}
        env:
          CI: "true"
          E2E_VOICE: ${{ inputs.voice && 'true' || 'false' }}
          PLAYWRIGHT_ARGS: ${{ inputs.playwright-args }}
        run: |
          # shellcheck disable=SC2086 # word splitting of the argument list is intended
          pnpm exec playwright test $PLAYWRIGHT_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            ${{ inputs.working-directory }}/playwright-report
            ${{ inputs.working-directory }}/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Clean up
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/tavrn-bin" "$RUNNER_TEMP/tavrn-artifact" "$RUNNER_TEMP/gitconfig"
