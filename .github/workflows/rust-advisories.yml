# SPDX-License-Identifier: Apache-2.0
#
# Reusable RustSec advisory check (`cargo-deny check advisories`) of one or several Cargo workspaces. It runs apart from
# rust-ci.yml, which checks bans, licenses and sources on every pull request: an advisory published today concerns
# every branch at once, whatever its diff. Callers run it on a schedule and on changes of Cargo.lock. A scheduled or
# manual run that fails opens an issue "RustSec advisories" in the calling repository (unless one is open already),
# so a new advisory is tracked instead of turning unrelated pull requests red; a pull request run just fails.
#
# Caller (tavrn-node, .github/workflows/advisories.yml):
#   on:
#     schedule:
#       - cron: "23 5 * * *"
#     pull_request:
#       paths: [Cargo.lock, deny.toml]
#     workflow_dispatch:
#   permissions:
#     contents: read
#     issues: write
#   jobs:
#     advisories:
#       if: ${{ vars.CI_ENABLED == 'true' }}
#       uses: just-tavrn/.github/.github/workflows/rust-advisories.yml@main
#       with:
#         manifests: .
#       secrets:
#         READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
name: Rust advisories (reusable)

on:
  workflow_call:
    inputs:
      manifests:
        description: Directories of the Cargo workspaces to check (one per line, each with its deny.toml).
        type: string
        default: "."
      cargo-deny-version:
        description: cargo-deny release to use.
        type: string
        default: "0.20.2"
      submodules:
        description: Checkout submodules (false, true or recursive).
        type: string
        default: recursive
    secrets:
      READ_TOKEN:
        description: Optional token with read access to the private just-tavrn repositories (git dependencies).
        required: false

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  advisories:
    name: RustSec advisories
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          token: ${{ github.token }}
          persist-credentials: false
      - name: Submodules
        if: ${{ inputs.submodules != '' && inputs.submodules != 'false' }}
        run: git submodule update --init ${{ inputs.submodules == 'recursive' && '--recursive' || '' }}
      - name: cargo-deny check advisories
        id: check
        env:
          DENY_VERSION: ${{ inputs.cargo-deny-version }}
          MANIFESTS: ${{ inputs.manifests }}
        run: |
          tmp="$(mktemp -d)"
          name="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}"
          curl -fsSL -o "$tmp/$name.tar.gz" "$base/$name.tar.gz"
          curl -fsSL -o "$tmp/$name.tar.gz.sha256" "$base/$name.tar.gz.sha256"
          echo "$(cut -d' ' -f1 < "$tmp/$name.tar.gz.sha256")  $tmp/$name.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/$name.tar.gz" -C "$tmp"
          deny="$tmp/$name/cargo-deny"
          failed=()
          while IFS= read -r dir; do
            [ -n "${dir//[[:space:]]/}" ] || continue
            echo "::group::$dir"
            (cd "$dir" && "$deny" --log-level error check advisories) || failed+=("$dir")
            echo "::endgroup::"
          done <<< "$MANIFESTS"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
            echo "::error::RustSec advisories in: ${failed[*]}"
            exit 1
          fi
      - name: Track the failure in an issue
        if: ${{ failure() && steps.check.outputs.failed != '' && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.check.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="RustSec advisories"
          body="cargo-deny reports advisories in: ${FAILED} (run ${RUN_URL}). Update the affected crates, or record a reviewed exception in deny.toml ([advisories] ignore, with the reason)."
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            echo "already tracked in #$number"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label security --label dependencies \
              || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
