# SPDX-License-Identifier: Apache-2.0
#
# Checks of this repository: workflow lint (actionlint), shell lint of the scripts, secret scan.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (actionlint, shellcheck, SPDX)
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SPDX headers
        run: scripts/check-spdx.sh
      - name: shellcheck
        run: shellcheck scripts/*.sh runner/*.sh
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # sha256 of actionlint_<version>_linux_amd64.tar.gz of that release (its checksums.txt)
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          tmp="$(mktemp -d)"
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tmp/$file" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$file"
          echo "${ACTIONLINT_SHA256}  $tmp/$file" | sha256sum -c -
          tar -xzf "$tmp/$file" -C "$tmp" actionlint
          "$tmp/actionlint" -color

  gitleaks:
    if: ${{ vars.CI_ENABLED == 'true' }}
    uses: ./.github/workflows/gitleaks.yml
