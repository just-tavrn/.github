# SPDX-License-Identifier: Apache-2.0
#
# Reusable container build and publish to the GitHub Container Registry (ghcr.io/just-tavrn/<image>).
# The image gets BuildKit's SLSA provenance (mode=max) and an SBOM as attestations in the registry; there is
# no cosign signing (a release caller adds GitHub's build provenance attestation, see tavrn-node release.yml).
# Pushing happens only when the caller sets push: true AND the run is on main or a v* tag; everything else
# (pull requests, branches) builds without pushing. On the self-hosted runners (runner: tavrn-heavy) buildx
# builds in the stack's DinD (DOCKER_HOST); release images are built GitHub-hosted, without any cache.
# Several platforms (platforms: linux/amd64,linux/arm64) build in ONE buildx invocation into one manifest list
# (the digest output is the list's digest). The Dockerfile cross-compiles on the runner's own platform
# (FROM --platform=$BUILDPLATFORM); QEMU only runs the RUN steps of the other platform's runtime stage.
#
# Caller (tavrn-node, .github/workflows/release.yml):
#   on:
#     push:
#       tags: ["v*"]
#   permissions:
#     contents: read
#     packages: write
#   jobs:
#     image:
#       if: ${{ vars.CI_ENABLED == 'true' }}
#       # Release paths pin this repository by commit (docs/GITHUB.md "Reusable workflows").
#       uses: just-tavrn/.github/.github/workflows/docker-publish.yml@<commit sha> # main of <date>
#       with:
#         dockerfile: deploy/Dockerfile
#         image-name: tavrn-node
#         push: true
#       secrets:
#         READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
name: Docker publish (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Where the job runs: a GitHub-hosted label (default ubuntu-latest) or a self-hosted runner class of the
          tavrn runner stack (tavrn-heavy, runner/README.md). Self-hosted only for trusted events: pushes, manual
          and scheduled runs, and pull requests from branches of the calling repository; pull requests from forks
          and from Dependabot always run on ubuntu-latest.
        type: string
        default: ubuntu-latest
      dockerfile:
        description: Path of the Dockerfile, relative to the repository root.
        type: string
        default: Dockerfile
      context:
        description: Build context.
        type: string
        default: "."
      image-name:
        description: Image name below ghcr.io/just-tavrn/ (for example tavrn-node).
        type: string
        required: true
      platforms:
        description: >-
          Target platforms, comma-separated (for example linux/amd64,linux/arm64). With more than one, QEMU is
          registered for the RUN steps the Dockerfile executes for a foreign platform, and the outputs describe the
          manifest list.
        type: string
        default: linux/amd64
      build-args:
        description: Build arguments, KEY=value lines.
        type: string
        default: ""
      push:
        description: Push to ghcr.io (only on main and on v* tags).
        type: boolean
        default: false
      submodules:
        description: Checkout submodules (false, true or recursive).
        type: string
        default: recursive
      no-cache:
        description: >-
          Build every layer anew (the layers are still written to the cache afterwards): for a scheduled rebuild whose
          RUN lines never change but must pick up new upstream releases (apt packages, the stable Rust toolchain).
          Tag builds never use a cache anyway.
        type: boolean
        default: false
      timeout-minutes:
        description: Time limit of the job (GitHub's default is six hours; the multi-platform node image takes about 20 minutes without its dependency layer).
        type: number
        default: 60
    secrets:
      READ_TOKEN:
        description: Optional token with read access to the private just-tavrn repositories (submodules; passed to the build as the secret "read_token").
        required: false
    outputs:
      digest:
        description: Digest of the built image (with several platforms, of the manifest list; attest this one).
        value: ${{ jobs.image.outputs.digest }}
      tags:
        description: Tags of the built image.
        value: ${{ jobs.image.outputs.tags }}

permissions:
  contents: read
  packages: write

jobs:
  # Self-hosted runners execute the job's code in the runner VM: forks, Dependabot and dependabot/* branches (even when
  # a person dispatches the run) never get them; route.yml holds that rule and falls back to ubuntu-latest for those
  # (runner/README.md, "Security").
  route:
    if: ${{ vars.CI_ENABLED == 'true' }}
    uses: ./.github/workflows/route.yml
    with:
      runner: ${{ inputs.runner }}

  image:
    name: Container image (${{ inputs.image-name }})
    needs: route
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    env:
      DO_PUSH: ${{ inputs.push && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
            echo "fetching just-tavrn repositories with READ_TOKEN"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repository itself is fetched with the job's own token (READ_TOKEN need not cover it); the
          # private submodules follow in the next step through the READ_TOKEN URL rewrite above.
          submodules: false
          token: ${{ github.token }}
          persist-credentials: false
      - name: Submodules
        if: ${{ inputs.submodules != '' && inputs.submodules != 'false' }}
        working-directory: .
        run: git submodule update --init ${{ inputs.submodules == 'recursive' && '--recursive' || '' }}
      # binfmt handlers for the foreign platforms' RUN steps. The binfmt image is pinned by digest (the action's
      # default is binfmt:latest) and never comes from the Actions cache (the cache rules below: nothing a cache
      # holds reaches a build unchecked).
      - name: QEMU for foreign platforms
        if: ${{ contains(inputs.platforms, ',') }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: ${{ env.DO_PUSH == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/just-tavrn/${{ inputs.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,format=short
            type=ref,event=pr
          labels: |
            org.opencontainers.image.vendor=tavrn
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          push: ${{ env.DO_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          # Only set when the caller passes READ_TOKEN (RUN --mount=type=secret,id=read_token in the Dockerfile).
          secrets: ${{ secrets.READ_TOKEN != '' && format('read_token={0}', secrets.READ_TOKEN) || '' }}
          # Build cache (runner/README.md "Security"): only GitHub-hosted runs share layers through the Actions cache,
          # in a scope of their own (<image>-hosted), so a self-hosted build never seeds layers that a GitHub-hosted
          # build imports; self-hosted runs keep the local cache of the stack's DinD only. Tag builds (releases)
          # start from nothing and write no cache; no-cache runs (scheduled rebuilds) start from nothing and refresh it.
          no-cache: ${{ inputs.no-cache || startsWith(github.ref, 'refs/tags/') }}
          cache-from: ${{ runner.environment == 'github-hosted' && !startsWith(github.ref, 'refs/tags/') && format('type=gha,scope={0}-hosted', inputs.image-name) || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && !startsWith(github.ref, 'refs/tags/') && format('type=gha,mode=max,scope={0}-hosted', inputs.image-name) || '' }}
