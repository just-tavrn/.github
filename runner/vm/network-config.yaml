#
# Network of the tavrn runner VM (netplan v2 via cloud-init). The virtio interface is renamed to uplink0, the
# name nftables.conf filters on. make-vm.sh uses this file with VM_IP_CIDR=dhcp; by default it writes the
# static variant (<CI_SUBNET>.10/24 via the router .1).
network:
  version: 2
  ethernets:
    uplink0:
      match:
        driver: virtio_net
      set-name: uplink0
      dhcp4: true
      dhcp6: false
      accept-ra: false
