#!/usr/sbin/nft -f
# SPDX-License-Identifier: Apache-2.0
#
# Firewall of the runner VM (runner/README.md, "Network"), installed as /etc/nftables.conf by make-vm.sh.
# Defense in depth behind the isolated VLAN of the host side: even a job that becomes root in the VM through
# DinD finds the LAN filtered here AND upstream on the router.
#
#   input    only SSH and the Portainer agent (9001) from ADMIN_V4, DNS from the Docker bridges to dnsmasq
#   egress   (output of the VM and forward of its containers through the uplink):
#            - never to private, loopback, link-local, CGNAT, documentation or multicast ranges (no LAN),
#            - TCP 80/443 and NTP only to addresses in @allow4/@allow6, which dnsmasq fills with the answers
#              for the allowlisted domains (dnsmasq-egress.conf); everything else is rejected and logged,
#            - DNS only from the VM itself (dnsmasq) to DNS_UPSTREAM_V4 (by default the router of the CI VLAN,
#              the one private address the VM may talk to), so containers cannot bypass dnsmasq.
#
# No "flush ruleset": Docker keeps its own tables. Reload with `sudo nft -f /etc/nftables.conf`.
# The placeholders @@...@@ are filled in by make-vm.sh.

define UPLINK = "uplink0"
define ADMIN_V4 = { @@ADMIN_CIDR@@ }
define DNS_UPSTREAM_V4 = { @@DNS_UPSTREAM@@ }

table inet tavrn_egress
delete table inet tavrn_egress

table inet tavrn_egress {
	# Filled by dnsmasq (nftset=); entries outlive dnsmasq's cache (max-cache-ttl) by far.
	set allow4 {
		type ipv4_addr
		flags timeout
		timeout 1d
	}
	set allow6 {
		type ipv6_addr
		flags timeout
		timeout 1d
	}
	set private4 {
		type ipv4_addr
		flags interval
		elements = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12,
			     192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24,
			     203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 }
	}
	set private6 {
		type ipv6_addr
		flags interval
		elements = { ::/127, ::ffff:0:0/96, 64:ff9b::/96, 100::/64, 2001:db8::/32, fc00::/7, fe80::/10,
			     ff00::/8 }
	}

	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iifname "lo" accept
		meta l4proto { icmp, ipv6-icmp } accept
		udp sport 67 udp dport 68 accept
		# DNS of the containers (Docker's embedded DNS and DinD forward to dnsmasq on docker0).
		iifname "docker0" meta l4proto { tcp, udp } th dport 53 accept
		iifname "br-*" meta l4proto { tcp, udp } th dport 53 accept
		# Administration from the admin network only.
		iifname $UPLINK ip saddr $ADMIN_V4 tcp dport { 22, 9001 } accept
		limit rate 6/minute log prefix "tavrn-in-drop " level info
	}

	chain forward {
		# Before Docker's own forward rules; both must accept a packet.
		type filter hook forward priority filter - 10; policy accept;
		oifname != $UPLINK accept
		jump egress
	}

	chain output {
		type filter hook output priority filter; policy accept;
		oifname != $UPLINK accept
		meta l4proto { tcp, udp } th dport 53 ip daddr $DNS_UPSTREAM_V4 accept
		jump egress
	}

	chain egress {
		ct state established,related accept
		# DHCP renewals go to the router's private address.
		udp sport 68 udp dport 67 accept
		ip daddr @private4 limit rate 6/minute log prefix "tavrn-egress-lan " level warn
		ip daddr @private4 reject with icmpx admin-prohibited
		ip6 daddr @private6 reject with icmpx admin-prohibited
		ip daddr @allow4 tcp dport { 80, 443 } accept
		ip6 daddr @allow6 tcp dport { 80, 443 } accept
		ip daddr @allow4 udp dport 123 accept
		ip6 daddr @allow6 udp dport 123 accept
		# Debugging only ("public" mode): any public address on 80/443. Uncomment, reload, comment again.
		# tcp dport { 80, 443 } accept
		limit rate 10/minute log prefix "tavrn-egress-drop " level info
		reject with icmpx admin-prohibited
	}
}
