#
# dnsmasq of the runner VM (runner/README.md, "Network"), installed as /etc/dnsmasq.d/tavrn-egress.conf by
# make-vm.sh. The only resolver of the VM and of its containers. Every answer for an allowlisted domain (and its
# subdomains) is added to the nftables sets allow4/allow6 of nftables.conf; the firewall lets TCP 80/443 and
# NTP through only to those addresses. A name outside the list still resolves, but its address stays blocked.
#
# Add a destination: one more nftset= line (or domain on an existing line), then `sudo systemctl restart dnsmasq`.
# The placeholders @@...@@ are filled in by make-vm.sh.

no-resolv
@@DNS_SERVERS@@
listen-address=127.0.0.1
# docker0 (Docker's "bip" in /etc/docker/daemon.json): containers and DinD's job containers ask here.
listen-address=172.17.0.1
bind-dynamic
domain-needed
bogus-priv
# Answers that point into private ranges are dropped (DNS rebinding towards the LAN).
stop-dns-rebind
rebind-localhost-ok
cache-size=10000
max-cache-ttl=300

# GitHub: git, API, Actions service, logs/artifacts/caches (Azure blob storage), releases, ghcr.io.
nftset=/github.com/githubusercontent.com/githubapp.com/ghcr.io/blob.core.windows.net/github-cloud.s3.amazonaws.com/4#inet#tavrn_egress#allow4,6#inet#tavrn_egress#allow6
# Rust: crates.io (index, static), rustup.
nftset=/crates.io/rust-lang.org/4#inet#tavrn_egress#allow4,6#inet#tavrn_egress#allow6
# JavaScript: npm registry, Node.js downloads, Playwright browser downloads.
nftset=/npmjs.org/nodejs.org/playwright.dev/playwright.download.prss.microsoft.com/playwright.azureedge.net/4#inet#tavrn_egress#allow4,6#inet#tavrn_egress#allow6
# Container images: Docker Hub (registry, auth, CDN) and Docker's apt repository.
nftset=/docker.io/docker.com/4#inet#tavrn_egress#allow4,6#inet#tavrn_egress#allow6
# Distribution packages for the VM (updates, NTP) and for image builds in the jobs (Ubuntu, Debian, Alpine).
nftset=/ubuntu.com/debian.org/alpinelinux.org/4#inet#tavrn_egress#allow4,6#inet#tavrn_egress#allow6
# Sources of tavrn's deploy/Dockerfile (ffmpeg, libwebp from Google Cloud Storage).
nftset=/ffmpeg.org/storage.googleapis.com/4#inet#tavrn_egress#allow4,6#inet#tavrn_egress#allow6
# Microsoft CRT and Windows SDK for cargo-xwin (manifest via aka.ms, packages from Visual Studio's download
# server), fetched by the runner entrypoint into the cache (runner/README.md, "Desktop builds").
nftset=/aka.ms/download.visualstudio.microsoft.com/4#inet#tavrn_egress#allow4,6#inet#tavrn_egress#allow6
# Python packages (not needed today):
# nftset=/pypi.org/pythonhosted.org/4#inet#tavrn_egress#allow4,6#inet#tavrn_egress#allow6
