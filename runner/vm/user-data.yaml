#cloud-config
# SPDX-License-Identifier: Apache-2.0
#
# cloud-init of the tavrn runner VM (runner/README.md). make-vm.sh fills in the @@...@@ placeholders; do not
# boot this template as is. Result: Ubuntu 24.04 with Docker Engine, the compose plugin and the Portainer agent,
# the egress firewall (nftables.conf) with its DNS allowlist (dnsmasq-egress.conf), no shared folders, no host
# mounts, journal in RAM.

hostname: @@VM_NAME@@
ssh_pwauth: false
disable_root: true

users:
  # Administration over SSH (key only).
  - name: ciadmin
    gecos: tavrn CI administration
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "@@SSH_PUBKEY@@"
  # The uid of the user "runner" inside the runner image: reserved, no login, no sudo, no docker group.
  - name: github-runner
    gecos: tavrn runner (container uid)
    uid: 1001
    shell: /usr/sbin/nologin
    lock_passwd: true
    no_create_home: true

